services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_docs
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "student_docs"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/student_docs
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=change_this_secret
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=adminpass
      - PORT=3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/usr/src/app/uploads
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    entrypoint: []
    command: ["sh", "-c", "npx prisma generate && npx next dev"]

volumes:
  db-data:
  uploads:
